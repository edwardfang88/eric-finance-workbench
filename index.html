<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>个人研究与知识工作台</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#ffffff; --primary:#2563eb; --primary-weak:#eef3ff;
    --text:#1f2937; --muted:#6b7280; --line:#e6e9f0; --line-strong:#d6dbe6;
    --up:#dc2626; --down:#16a34a; --warn:#ea580c; --ok:#16a34a;
    --radius:12px; --radius-sm:8px; --gap:16px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 8px 30px rgba(16,24,40,.14);
    --sidebar-w:218px; --topbar-h:56px; --rightbar-w:264px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbd2e0;border-radius:6px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--primary-weak);color:var(--primary);border:1px solid #d7e3ff}
  .badge.sample{background:#fff7ed;color:var(--warn);border-color:#fed7aa}
  .badge.risk{background:#fef2f2;color:var(--up);border-color:#fecaca}
  .badge.ok{background:#f0fdf4;color:var(--ok);border-color:#bbf7d0}
  .badge.gray{background:#f1f3f7;color:var(--muted);border-color:var(--line)}

  /* layout */
  #app{display:flex;flex-direction:column;min-height:100vh}
  .topbar{height:var(--topbar-h);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px}
  .brand small{font-weight:500;color:var(--muted);font-size:11px}
  .global-search{flex:1;max-width:420px;position:relative}
  .global-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:20px;padding:0 14px 0 36px;background:#f7f9fc;font-size:13px;outline:none}
  .global-search input:focus{border-color:var(--primary);background:#fff}
  .global-search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:#374151}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
  .icon-btn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--up);border:2px solid #fff}
  .btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#374151;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{background:#1d4ed8;color:#fff}
  .btn.danger{color:var(--up);border-color:#fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f1f3f7;color:var(--text)}
  .add-menu{position:absolute;top:46px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;z-index:60;display:none}
  .add-menu.open{display:block}
  .add-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:none;background:transparent;border-radius:8px;font-size:13px;color:#374151;text-align:left}
  .add-menu button:hover{background:var(--primary-weak);color:var(--primary)}

  .layout{flex:1;display:flex;min-height:0}
  .sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto}
  .nav-group-label{font-size:11px;color:var(--muted);padding:10px 12px 4px;letter-spacing:.04em}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#374151;font-size:13.5px;font-weight:500;position:relative}
  .nav-item .ni-ico{width:20px;text-align:center;color:var(--muted)}
  .nav-item .ni-count{margin-left:auto;font-size:11px;background:#eef1f6;color:var(--muted);border-radius:10px;padding:0 7px;min-width:18px;text-align:center}
  .nav-item:hover{background:#f4f6fb}
  .nav-item.active{background:var(--primary-weak);color:var(--primary)}
  .nav-item.active .ni-ico{color:var(--primary)}
  .nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--primary)}

  .view{flex:1;min-width:0;padding:20px 24px 40px;overflow-y:auto;height:calc(100vh - var(--topbar-h))}
  .rightbar{width:var(--rightbar-w);background:var(--card);border-left:1px solid var(--line);padding:16px 14px;overflow-y:auto;height:calc(100vh - var(--topbar-h));position:sticky;top:var(--topbar-h)}
  .rightbar h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .rightbar .rem-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .rightbar .rem-item:last-child{border-bottom:none}
  .rem-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--primary)}
  .rem-dot.urgent{background:var(--up)} .rem-dot.done{background:var(--ok)}

  .bottomnav{display:none}

  /* page header */
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .page-head h1{font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-0.3px;color:var(--text)}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:4px;font-weight:500}
  .ph-main{display:flex;align-items:center;gap:12px}
  .ph-ico{width:40px;height:40px;border-radius:11px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 2px 6px rgba(37,99,235,0.08)}
  .ph-titles{display:flex;flex-direction:column;gap:2px}
  .subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .subnav button{background:none;border:none;padding:9px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
  .subnav button:hover{color:var(--text)}
  .subnav button.active{color:var(--primary);border-bottom-color:var(--primary)}

  /* cards & grid */
  .grid{display:grid;gap:var(--gap)}
  .cards-2{grid-template-columns:repeat(2,1fr)}
  .cards-3{grid-template-columns:repeat(3,1fr)}
  .cards-4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .card.clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .card.clickable:hover{box-shadow:var(--shadow-lg);border-color:#cdd6ea}
  .card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .stat-num{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat-label{color:var(--muted);font-size:12.5px;margin-top:2px}
  .stat-row{display:flex;align-items:center;gap:12px}
  .stat-ico{width:42px;height:42px;border-radius:11px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-size:19px;flex:none}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .panel + .panel{margin-top:var(--gap)}
  .panel h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;background:#fafbfd;position:sticky;top:0}
  tbody tr:hover{background:#fafbff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .mini-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:12px;color:#374151}
  .mini-btn:hover{border-color:var(--primary);color:var(--primary)}
  .mini-btn.danger:hover{border-color:var(--up);color:var(--up)}

  /* tags & chips */
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:20px;background:#eef1f6;color:#475569;border:1px solid #e2e8f0}
  .tag .x{cursor:pointer;color:#94a3b8}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:8px;background:#f1f3f7;color:#475569;border:1px solid var(--line);cursor:pointer}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* progress */
  .progress{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--primary);border-radius:6px}

  /* form */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:500}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;outline:none;color:var(--text)}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:74px}
  .field-row{display:flex;gap:12px}.field-row > *{flex:1}
  .form-err{color:var(--up);font-size:12px;margin-top:4px}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
  .modal-mask.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
  .modal.wide{max-width:720px}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:16px}
  .modal-body{padding:18px}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .x-close{border:none;background:#f1f3f7;width:30px;height:30px;border-radius:8px;font-size:16px;color:#64748b}
  .x-close:hover{background:#e6eaf2}

  /* misc states */
  .empty{text-align:center;padding:48px 16px;color:var(--muted)}
  .empty .e-ico{font-size:34px;opacity:.5;margin-bottom:8px}
  .empty .e-link{color:var(--primary);cursor:pointer;margin-top:8px;display:inline-block}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .loading .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
  .banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
  .banner .b-ico{font-size:16px}

  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:500}
  .muted-small{color:var(--muted);font-size:12px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .flex{display:flex;align-items:center;gap:10px}
  .flex-wrap{flex-wrap:wrap}
  .between{justify-content:space-between}
  .mt{margin-top:14px}.mb{margin-bottom:14px}
  .link{color:var(--primary);cursor:pointer}
  .link:hover{text-decoration:underline}
  .src-line{font-size:11.5px;color:var(--muted);margin-top:6px}
  .domain-pill{font-size:11px;background:#f1f3f7;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:#64748b;font-family:ui-monospace,monospace}

  /* calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:6px 0}
  .cal-cell{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:6px;font-size:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:3px}
  .cal-cell.out{background:#fafbfc;color:#c2c8d4}
  .cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .cal-cell-top{display:flex;justify-content:space-between;align-items:center}
  .cal-cell .d-num{font-weight:600}
  .cal-items{display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cal-chip{font-size:10px;line-height:1.25;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
  .cal-chip:hover{opacity:.85}
  .task-chip{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
  .rem-chip{background:#ffedd5;color:#9a3412;border-color:#fed7aa}
  .cal-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block;margin:1px}

  /* timeline */
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 14px 6px}
  .tl-item::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
  .tl-item .t-time{font-size:11.5px;color:var(--muted)}

  /* svg chart */
  .chart-wrap{width:100%;overflow:hidden}
  .chart-wrap svg{width:100%;height:auto;display:block}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* search results */
  .search-section{margin-bottom:18px}
  .search-section h3{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .search-result{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;cursor:pointer}
  .search-result:hover{border-color:var(--primary);background:#fafbff}
  .search-result .sr-ico{width:34px;height:34px;border-radius:9px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;flex:none}
  .search-result .sr-main{flex:1;min-width:0}
  .search-result .sr-title{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-result .sr-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-result mark{background:#fef08a;color:#713f12;border-radius:3px;padding:0 2px}

  .assoc-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:12.5px;background:#fafbfd}
  .assoc-row .a-ico{color:var(--primary)}

  @media (max-width:1080px){ .rightbar{display:none} }
  @media (max-width:820px){
    .sidebar{display:none}
    .view{padding:14px 14px 80px;height:auto}
    .topbar{gap:8px;padding:0 12px}
    .brand small{display:none}
    .global-search{order:3;max-width:none;flex-basis:100%;display:none}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;height:58px}
    .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#94a3b8;font-size:10.5px;text-decoration:none}
    .bottomnav a.active{color:var(--primary)}
    .bottomnav a .bi-ico{font-size:18px}
    .cards-2,.cards-3{grid-template-columns:1fr}
    .field-row{flex-direction:column;gap:0}
    .modal{max-width:100%}
  }
  .cover-box{position:relative;width:54px;height:74px;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:none;background:linear-gradient(135deg,#eef1f6,#dfe5ee)}
  .cov-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#94a3b8;line-height:1.1;text-align:center;padding:4px;letter-spacing:1px;gap:3px}
  .cov-init{font-size:18px}
  .cov-hint{font-size:10px;font-weight:500;color:#b0c0d0;letter-spacing:0}
  .cov-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .quick-save{background:linear-gradient(135deg,#faf5ff,#f5f3ff);border:1px solid #e9d5ff}
  .quick-save .panel-head{background:transparent;border:0;padding-left:0}
  .kb-detail{max-height:70vh;overflow:auto}
  .kb-region{padding:10px 0;border-bottom:1px dashed var(--line)}
  .kb-region:last-child{border-bottom:0}
  .kb-region h4{margin:0 0 8px;font-size:14px;color:var(--primary)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">研</div>
      <div>个人研究与知识工作台<br><small>Eric 的综合研究与复盘空间</small></div>
    </div>
    <div class="global-search">
      <span class="ico">🔍</span>
      <input id="globalSearch" type="text" placeholder="全局搜索：书籍 / 笔记 / 股票 / 收藏 / 任务…" autocomplete="off" />
    </div>
    <div class="top-actions">
      <button class="btn primary" id="addBtn">＋ 新建</button>
      <div class="add-menu" id="addMenu">
        <button data-add="stock">📈 添加持仓 / 复盘</button>
        <button data-add="book">📚 添加书籍</button>
        <button data-add="note">✏️ 写读书笔记</button>
        <button data-add="kb">🔗 收藏链接</button>
        <button data-add="task">✅ 新建任务</button>
        <button data-add="reminder">⏰ 添加提醒</button>
      </div>
      <button class="icon-btn" id="reminderBtn" title="提醒">🔔<span class="dot" id="remDot" style="display:none"></span></button>
      <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="view" id="view"></main>
    <aside class="rightbar" id="rightbar"></aside>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
